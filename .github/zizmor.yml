# Zizmor security scanner configuration
# See: https://docs.zizmor.sh/configuration/
#
# Pre-commit uses: --persona=regular --min-severity=medium --min-confidence=medium
# This catches high-signal security issues while reducing noise.
#
# To run a full audit: zizmor --persona=auditor .github/workflows/

rules:
  # Same scope as the org policy: the caller's job runs only for this repository's own pull request runs.
  dangerous-triggers:
    ignore:
      - openhands-ci-fix.yml

  # Trusted first-party and central reusable workflows follow their owners'
  # reviewed release tags. Other unpinned action references remain findings.
  unpinned-uses:
    config:
      policies:
        dryvist/*: ref-pin
        JacobPEvans/*: ref-pin

# IGNORED: These workflows use reusable workflows from JacobPEvans/.github-ai that require
  # secrets for authentication (API keys, tokens). secrets: inherit is intentional
  # as the reusable workflows are owned by the same org and need these secrets.
  # TODO: Audit and enumerate explicit secrets instead of inheriting all
  secrets-inherit:
    ignore:
      - ai-all.yml
      - ai-merge-gate.yml
